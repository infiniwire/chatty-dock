name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      signed:
        description: Build with signing and notarization credentials
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - id: version
        name: Validate version and tag
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw new Error('Invalid semantic version');
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error('Tag/package version mismatch');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            os: win
            arch: x64
            unpacked: dist/win-unpacked/ChattyDock.exe
          - runner: macos-15-intel
            os: mac
            arch: x64
            unpacked: dist/mac/ChattyDock.app/Contents/MacOS/ChattyDock
          - runner: macos-15
            os: mac
            arch: arm64
            unpacked: dist/mac-arm64/ChattyDock.app/Contents/MacOS/ChattyDock
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      DOCK_SIGNED: ${{ (inputs.signed || vars.SIGNED_RELEASES == 'true' || (matrix.os == 'mac' && vars.SIGNED_MAC_RELEASES == 'true') || (matrix.os == 'win' && vars.SIGNED_WINDOWS_RELEASES == 'true')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify runner architecture
        run: node -e "if(process.arch !== '${{ matrix.arch }}') process.exit(1)"
      - run: npm ci
      - run: npm run verify
      - name: Package application
        run: node scripts/package.mjs ${{ matrix.os }} ${{ matrix.arch }}
        env:
          CSC_LINK: ${{ matrix.os == 'mac' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Smoke test packaged application
        run: npm run test:electron
        env:
          DOCK_EXECUTABLE: ${{ matrix.unpacked }}
      - name: Verify silent update installation and automatic relaunch
        if: matrix.os == 'win'
        run: npm run test:update-install
      - name: Upload packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          retention-days: 14
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-evidence-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            artifacts/*.json
            artifacts/*.png
            artifacts/update-install/result.json
          retention-days: 14
  collect:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: release-assets
      - name: Validate complete artifact set and calculate checksums
        run: node scripts/release-assets.mjs release-assets
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: complete-release-${{ needs.validate.outputs.version }}
          path: release-assets/
      - name: Publish complete GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          MAC_SIGNED: ${{ (vars.SIGNED_RELEASES == 'true' || vars.SIGNED_MAC_RELEASES == 'true') && 'true' || 'false' }}
          WINDOWS_SIGNED: ${{ (vars.SIGNED_RELEASES == 'true' || vars.SIGNED_WINDOWS_RELEASES == 'true') && 'true' || 'false' }}
        run: |
          if [[ "$MAC_SIGNED" == 'true' ]]; then
            printf 'macOS packages are Developer ID signed and notarized; automatic installation is supported.\n' > notes.md
          else
            printf 'macOS packages are ad-hoc signed and not notarized; automatic installation requires a future Developer ID signed build.\n' > notes.md
          fi
          if [[ "$WINDOWS_SIGNED" == 'true' ]]; then
            printf '\nWindows packages are signed.\n' >> notes.md
          else
            printf '\nWindows packages are unsigned. Per-user silent updates are supported; OS trust policies still apply.\n' >> notes.md
          fi
          printf '\nStartup automatic updates are included. Private repository access requires a local GitHub CLI login, GH_TOKEN, or an OS-encrypted read token.\n' >> notes.md
          printf '\nIndependent ChatGPT desktop wrapper. See README for login compatibility and manual verification limits.\n' >> notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --draft=true
          else
            gh release create "$RELEASE_TAG" --draft --title "ChattyDock $RELEASE_VERSION" --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.exe release-assets/*.dmg release-assets/*.zip release-assets/latest.yml release-assets/latest-mac.yml release-assets/SHA256SUMS.txt --clobber
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --notes-file notes.md
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --notes-file notes.md
          fi
